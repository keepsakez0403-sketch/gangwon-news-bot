name: Retry Workflow on Failure

on:
  workflow_run:
    workflows: ["Gangwon News Scrap Bot"] # 감시할 메인 워크플로 이름
    types: [completed]

jobs:
  retry-failed-run:
    runs-on: ubuntu-latest
    # 메인 워크플로가 '실패'했고, 첫 번째 시도(run_attempt == 1)였을 때만 재실행
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}

    permissions:
      actions: write # 워크플로 재실행 권한 부여

    steps:
      - name: 실패 확인 및 재실행 대기
        run: |
          echo "⚠️ Gangwon News Scrap Bot 실행 실패를 감지했습니다."
          echo "일시적인 서버 과부하를 고려하여 60초 대기 후 재실행합니다..."
          sleep 60

      - name: 실패한 워크플로 재실행 트리거
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run rerun ${{ github.event.workflow_run.id }} --failed
          echo "✅ 실패한 워크플로 재실행 요청 완료!"
